<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PC Store</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <div class="header-main">
            <div class="brand">
                <img class="logo" src="img/logo.jpeg" alt="Logo da PC Store">
                <div class="brand-copy"><h1>PC Store</h1><p>Sua loja de informática.</p></div>
            </div>
            <form class="site-search" action="produtos.html" method="get">
                <label for="site-search">Buscar produtos</label>
                <input type="search" id="site-search" name="q" placeholder="Buscar produtos...">
                <button type="submit" aria-label="Buscar">🔍</button>
            </form>
            <div class="header-actions">
                <div class="account-links"><a href="login.html">Login</a><a href="cadastro.html">Cadastro</a></div>
                <a class="cart-button" href="dashboard.html" aria-label="Abrir carrinho">🛒</a>
                <input class="theme-toggle" type="checkbox" id="theme-toggle">
                <label class="theme-button" for="theme-toggle" aria-label="Alternar tema"><span class="dark-label">🌙</span><span class="light-label">☀️</span></label>
            </div>
        </div>
        <nav class="nav-bar">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="produtos.html">Produtos</a></li>
                <li><a href="sobre.html">Sobre</a></li>
                <li><a href="contatos.html">Contatos</a></li>
                <li><a href="dashboard.html">Painel</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Criar uma conta</h2>
        <p>Cadastre seus dados para continuar.</p>

        <form action="dashboard.html" method="get">
            <p>
                <label for="nome">Nome completo:</label>
                <input type="text" id="nome" required>
            </p>
            <p>
                <label for="email">E-mail:</label>
                <input type="email" id="email" placeholder="aluno@email.com" required>
            </p>
            <p>
                <label for="senha">Senha:</label>
                <input type="password" id="senha" required>
            </p>
            <button type="submit">Cadastrar</button>
            <button type="reset">Limpar</button>
        </form>
        <p><a href="login.html">Voltar para o login</a></p>
    </main>

    <footer>
        <p>© 2026 PC Store</p>
        <p> Todos os direitos reservados</p>
        <p><a href="contatos.html">Fale conosco</a></p>
    </footer>
</body>
</html>
